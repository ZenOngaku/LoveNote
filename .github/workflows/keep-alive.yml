# ============================================================
# Supabase 免费项目保活定时任务
# ============================================================
# 背景：Supabase 免费版项目若连续 7 天没有任何 API 请求会被自动
#       暂停（paused）。本项目只要日常使用就不会触发；这个
#       workflow 是给「偶尔长期不用」的场景兜底的。
#
# 使用方法：
#   1. 把本项目推送到 GitHub 仓库
#   2. 仓库 Settings → Secrets and variables → Actions → New repository secret
#      - 添加 SUPABASE_URL      （值 = 你的 Project URL）
#      - 添加 SUPABASE_ANON_KEY （值 = 你的 anon public key）
#   3. 完成。此后每 2 天自动 ping 一次数据库接口保活
#      （也可在本页面 Run workflow 手动触发测试）
#
# 安全说明：anon key 是公开客户端密钥，放入 GitHub Secrets 安全。

name: Keep Supabase Alive

on:
  schedule:
    # 每 2 天 UTC 3:00（北京时间 11:00）执行一次
    - cron: '0 3 */2 * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 先校验 Secret 是否配置且格式正确，避免 curl 裸报 exit 3 无法定位
      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Secret SUPABASE_URL 未设置：仓库 Settings → Secrets and variables → Actions 添加（值 = Supabase Project URL）"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY 未设置：仓库 Settings → Secrets and variables → Actions 添加（值 = publishable/anon key）"
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::SUPABASE_URL 格式异常：应为 https://<项目名>.supabase.co，检查是否粘贴时带了空格/换行"
              exit 1
              ;;
          esac
          echo "Secrets OK（值已做掩码校验，不打印内容）"
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 保活目的 = 产生 API 请求；任何 HTTP 响应（含 4xx/5xx）都算请求成功。
          # 因此不用 -f，只区分「请求到达」与「网络层失败」。
          status="$(
            curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              --url "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          )" || {
            echo "::error::网络请求失败：无法连接到 ${SUPABASE_URL}（检查 URL 是否可达）"
            exit 1
          }
          echo "Keep-alive ping 成功（HTTP ${status}）"
